name: Publish portfolio (manual approval only)
# Deliberately no push or pull_request trigger. Never publishes a preview branch.
on:
  workflow_dispatch:
    inputs:
      approved:
        description: I approve replacing the published portfolio with this reviewed main commit
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approved == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved static export
        id: deployment
        uses: actions/deploy-pages@v5.0.1
